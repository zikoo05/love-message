<!DOCTYPE html>
<html>
<head>
    <title>For you</title>

    <style>
        body {
            background:fixed#ffe6f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color:#ff4d88;
        }
        
        button {
            background: #ff4d88;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
        }
        
        button:hover {
            background: #ff1f6d;
        }
    </style>
</head>

<body>
    <h1>I made something for you</h1>

    <button onclick="openMessage()">Open Message</button>

    <script>
        function openMessage() {
            alert(
                "I just wanted to remind you that you mean a lot to me. \n\n" +
                "Thank you for being part of my life."
            );
        }
    </script>
</body>
</html>
